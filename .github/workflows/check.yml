# `pnpm check` (build + typecheck + test) on every PR and on main. Its job,
# `check`, is the status that branch protection requires before a PR can land.
name: check

on:
  pull_request:
  push:
    # pi/** too: Pi's PRs are opened by pi-pr as github-actions[bot], and a run for a PR a bot opened waits for
    # someone to approve it, so the push's run is the one that reports `check` on the PR's head.
    branches: [main, "pi/**"]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The stores' tests run against a real Postgres and a real Redis: A2's log and vboard's tables on each,
    # and the tables' conformance suite on both.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
